<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4158D0">
        <animate attributeName="stop-color" values="#4158D0;#0093E9;#8EC5FC;#00E8FF;#4158D0" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C850C0">
        <animate attributeName="stop-color" values="#C850C0;#80D0C7;#E0C3FC;#3fb950;#C850C0" dur="15s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15"/>
  <!-- Decorative abstract lines -->
  <path d="M -100 250 Q 200 -50 900 100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="15" />
  <path d="M 0 300 Q 450 -100 1000 200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="30" />
  
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="900" fill="#ffffff" filter="url(#glow)">AKASSH M</text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#ffffff" opacity="0.9" font-weight="600" letter-spacing="2">AI &amp; Data Science | Competitive Programmer</text>
</svg>