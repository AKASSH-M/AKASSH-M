<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README Animation Test</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
        }
        img {
            max-width: 100%;
        }
        .center {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="center">
        <img src="./assets/banner.svg" alt="Banner" width="100%">
    </div>
    
    <div class="center">
        <img src="./assets/typewriter.svg" alt="Typewriter" width="100%">
    </div>
    
    <br/>
    
    <div class="center">
        <table>
            <tr>
                <td align="center" width="45%" valign="top">
                    <img src="./assets/portrait.svg" alt="ASCII Portrait" width="100%">
                </td>
                <td align="center" width="55%" valign="top">
                    <img src="./assets/info.svg" alt="Info Terminal" width="100%">
                </td>
            </tr>
        </table>
    </div>
    
    <br/>
    
    <div class="center">
        <img src="https://raw.githubusercontent.com/AKASSH-M/AKASSH-M/output/github-contribution-grid-snake.svg" alt="Snake" width="100%">
    </div>

    <br/>

    <div class="center">
        <table>
            <tr>
                <td align="center" width="50%" valign="top">
                    <img src="./assets/competitive.svg" alt="Competitive" width="100%">
                </td>
                <td align="center" width="50%" valign="top">
                    <img src="./assets/competitions.svg" alt="Competitions" width="100%">
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
