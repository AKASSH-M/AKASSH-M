name: Generate Assets

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/scripts/**'
      - 'assets/ascii-art.txt'
  workflow_dispatch:

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generation scripts
        run: |
          python .github/scripts/generate_banner_svg.py
          python .github/scripts/generate_typewriter_svg.py
          python .github/scripts/generate_portrait_svg.py
          python .github/scripts/generate_info_svg.py
          python .github/scripts/generate_competitive_svg.py
          python .github/scripts/generate_competitions_svg.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: auto-generate profile assets [skip ci]"
          git push
